spring.application.name=ByteBlog
# ================================
# \u8FDE\u63A5\u6570\u636E\u5E93 \u6838\u5FC3\u914D\u7F6E
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ================================
# \u8FDE\u63A5\u6570\u636E\u5E93 \u6838\u5FC3\u914D\u7F6E
# ================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
# ================================
# MyBatis \u6838\u5FC3\u914D\u7F6E
# ================================
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.ocean.module.*.entity
mybatis.configuration.map-underscore-to-camel-case=true
# ================================
# \u5C06 MyBatis \u7684\u65E5\u5FD7\u5B9E\u73B0\u6539\u4E3A\u63A7\u5236\u53F0\u8F93\u51FA
# ================================
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# ================================
# \u63A7\u5236\u6587\u4EF6\u4E0A\u4F20\u5927\u5C0F
# ================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# ================================
# \u65F6\u95F4\u683C\u5F0F\u4F18\u5316
# ================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
# ================================
# ip2region \u6838\u5FC3\u914D\u7F6E
# ================================
ip2region.v4.db-path=classpath:ipdb/ip2region_v4.xdb
ip2region.v6.db-path=classpath:ipdb/ip2region_v6.xdb
# ================================================================
